<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Slide – KHTN 6A10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060914;
    --text: #f2f5ff;
    --dim: #9aa4c4;
    --cyan: #5ee7ff;
    --violet: #8b7bff;
    --flame: #ff8a4c;
    --glass: rgba(255,255,255,.06);
    --edge: rgba(255,255,255,.14);
    --head: "Bricolage Grotesque", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    --body: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; color: var(--text); font-family: var(--body); background: #000; min-height: 100%; }

  /* nền tĩnh (không animation) nên rất nhẹ */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    animation: fadeIn 1.6s ease-out both;
    background:
      radial-gradient(600px 420px at 12% 8%, rgba(94,231,255,.22), transparent 70%),
      radial-gradient(640px 460px at 88% 30%, rgba(139,123,255,.26), transparent 70%),
      radial-gradient(520px 380px at 40% 100%, rgba(255,138,76,.18), transparent 70%),
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px) 0 0 / 26px 26px,
      var(--bg);
  }
  .glass {
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 20px;
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.28);
  }

  /* KHTN 6A10 thu nhỏ ở góc trái (khớp với chữ bay lên từ trang loading) */
  .pill {
    position: fixed; z-index: 5;
    top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px 0 10px; line-height: 18px;   /* VIÊN NÀY GIỐNG HỆT ở index.html, ui.html, slide.html: không sửa riêng từng file */
    border-radius: 999px;
    font-family: var(--head); font-weight: 800; font-size: 15px; letter-spacing: -.01em;
    animation: pillBg .7s ease-out both;
  }
  .pill svg, .pill small { animation: fadeIn .7s ease-out both; }
  .pill > span { view-transition-name: khtn-brand; }
  .pill svg { width: 18px; height: 18px; flex: none; }
  .pill small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--dim); letter-spacing: 0; }
  @keyframes pillBg { from { background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; } }
  @keyframes fadeIn { from { opacity: 0; } }

  main { position: relative; max-width: 1040px; margin: 0 auto; padding: 20px; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; animation: fadeIn 1.4s ease-out .35s both; }

  .hero { display: flex; align-items: center; justify-content: center; text-align: center; }

  /* Chuyển slide ngay trong slide.html, không tải lại trang. */
  .deck-slide {
    position: absolute; inset: 0; width: 100%; min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 5vw, 64px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translate3d(52px, 0, 0) scale(.985);
    filter: blur(8px);
    transition: opacity .72s ease, transform .82s cubic-bezier(.22, 1, .36, 1),
                filter .72s ease, visibility 0s linear .82s;
    will-change: opacity, transform, filter;
  }
  .deck-slide.is-active {
    position: relative; opacity: 1; visibility: visible; pointer-events: auto;
    transform: translate3d(0, 0, 0) scale(1); filter: blur(0);
    transition: opacity .72s ease, transform .82s cubic-bezier(.22, 1, .36, 1),
                filter .72s ease, visibility 0s;
  }
  /* Giữ nguyên vị trí nhích lên của slide chào mở đầu. */
  .deck-slide.hero.is-active { transform: translate3d(0, -4vh, 0) scale(1); }
  .deck-slide.is-before { transform: translate3d(-52px, 0, 0) scale(.985); }
  .deck-slide.is-after { transform: translate3d(52px, 0, 0) scale(.985); }

  .members-content { width: min(100%, 900px); text-align: center; }
  .section-kicker {
    margin: 0 0 14px; color: var(--cyan); font-size: 13px; font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase;
  }
  .members-title {
    margin: 0; font-family: var(--head); font-weight: 800;
    font-size: clamp(42px, 7vw, 78px); line-height: 1.05; letter-spacing: -.035em;
    text-shadow: 0 0 36px rgba(94,231,255,.24);
  }
  .members-subtitle {
    max-width: 650px; margin: 20px auto 0; color: var(--dim);
    font-size: clamp(16px, 2.2vw, 20px); line-height: 1.65;
  }
  .members-stage {
    margin: clamp(28px, 5vh, 48px) auto 0; min-height: 150px;
    display: grid; place-items: center; padding: 28px;
    border: 1px solid var(--edge); border-radius: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 18px 48px rgba(0,0,0,.22);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
  }
  .members-stage p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.6; }
  .slide-nav {
    position: fixed; z-index: 10; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 14px; transform: translateX(-50%);
  }
  .nav-button {
    min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 0 18px; border: 1px solid var(--edge); border-radius: 999px;
    color: var(--text); background: rgba(255,255,255,.07); font: 500 14px var(--body);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    cursor: pointer; transition: transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .nav-button[hidden] { display: none; }
  .nav-button:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); border-color: rgba(94,231,255,.45); }
  .nav-button:active { transform: translateY(0) scale(.98); }
  .nav-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
  .nav-button svg { width: 17px; height: 17px; }
  .slide-count { min-width: 42px; color: var(--dim); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  /* Liquid-glass-inspired response: highlight follows the pointer, then softly recedes. */
  .nav-button {
    --pointer-x: 50%; --pointer-y: 50%; --tilt-x: 0deg; --tilt-y: 0deg;
    position: relative; isolation: isolate; overflow: hidden;
    background: linear-gradient(145deg, rgba(255,255,255,.19), rgba(255,255,255,.075) 46%, rgba(13,19,38,.62));
    border-color: rgba(255,255,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.34),
                inset 0 -1px 0 rgba(0,0,0,.24),
                0 8px 26px rgba(0,0,0,.28),
                0 0 0 1px rgba(94,231,255,.035);
    -webkit-backdrop-filter: blur(22px) saturate(185%);
    backdrop-filter: blur(22px) saturate(185%);
    transform: perspective(700px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(0) scale(1);
    transform-style: preserve-3d;
    transition: transform .42s cubic-bezier(.2,.8,.2,1),
                background .35s ease, border-color .35s ease,
                box-shadow .42s cubic-bezier(.2,.8,.2,1),
                filter .35s ease;
    touch-action: manipulation;
  }
  .nav-button::before,
  .nav-button::after {
    content: ""; position: absolute; inset: 0; z-index: 0;
    pointer-events: none; border-radius: inherit;
  }
  .nav-button::before {
    opacity: 0;
    background: radial-gradient(145px circle at var(--pointer-x) var(--pointer-y),
      rgba(255,255,255,.46), rgba(94,231,255,.16) 34%, rgba(139,123,255,.08) 53%, transparent 76%);
    transition: opacity .32s ease;
  }
  .nav-button::after {
    inset: -55% -35%; opacity: 0;
    background: linear-gradient(112deg, transparent 38%, rgba(255,255,255,.22) 48%, rgba(255,255,255,.07) 53%, transparent 63%);
    transform: translateX(-42%) rotate(8deg);
  }
  .nav-button > * { position: relative; z-index: 1; }
  .nav-button.is-hovered {
    transform: perspective(700px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(-2px) scale(1.025);
    background: linear-gradient(145deg, rgba(255,255,255,.23), rgba(255,255,255,.09) 48%, rgba(13,19,38,.66));
    border-color: rgba(174,239,255,.48);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.48),
                inset 0 -1px 0 rgba(0,0,0,.22),
                0 13px 34px rgba(0,0,0,.34),
                0 0 24px rgba(94,231,255,.12);
  }
  .nav-button.is-hovered::before { opacity: 1; }
  .nav-button.is-hovered::after { opacity: .8; animation: glassSweep .85s cubic-bezier(.2,.75,.25,1) both; }
  .nav-button.is-pressed {
    transform: perspective(700px) rotateX(0) rotateY(0) translateY(0) scale(.955);
    filter: brightness(1.12);
    box-shadow: inset 0 2px 8px rgba(0,0,0,.18), 0 3px 12px rgba(0,0,0,.22);
  }
  .nav-button.is-pressed::before { opacity: .82; }
  /* Nút giữ nguyên vị trí trong thanh điều hướng; chỉ có phản hồi glass khi rê/chạm. */
  .nav-button { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }

  @keyframes glassSweep {
    from { transform: translateX(-42%) rotate(8deg); }
    to { transform: translateX(42%) rotate(8deg); }
  }
  @media (max-width: 520px) {
    .deck-slide { padding: 24px 18px 92px; }
    .members-stage { min-height: 125px; padding: 20px; }
    .slide-nav { bottom: max(14px, env(safe-area-inset-bottom)); gap: 9px; }
    .nav-button { min-height: 42px; padding: 0 14px; font-size: 13px; }
  }
  .hero h1 {
    margin: 0 auto; max-width: 1100px;
    font-family: var(--head); font-weight: 800;
    font-size: clamp(38px, 6.8vw, 90px); line-height: 1.08; letter-spacing: -.03em;
    text-shadow: 0 0 40px rgba(94,231,255,.35);
    text-wrap: balance;
  }
  .hero p { margin: 18px auto 0; max-width: 46ch; color: var(--dim); font-size: clamp(15px, 2.4vw, 18px); line-height: 1.6; }

  /* Slide mở đầu: lời chào nằm hơi cao hơn tâm, chủ đề ở ngay bên dưới. */
  .hero { transform: translateY(-4vh); }
  .hero h1 { animation: greetingIn .9s cubic-bezier(.22, 1, .36, 1) both; }
  .hero .topic {
    margin: 24px auto 0; max-width: 1000px; color: var(--text); font-weight: 500;
    font-size: clamp(22px, 3.4vw, 36px); line-height: 1.45;
    letter-spacing: .015em; text-shadow: 0 0 24px rgba(94,231,255,.18);
    animation: topicIn .9s cubic-bezier(.22, 1, .36, 1) .16s both;
  }
  @keyframes greetingIn {
    from { opacity: 0; transform: translateY(18px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes topicIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }




  @media (prefers-reduced-motion: reduce) {
    .pill, .pill svg, .pill small, main, .bg { animation: none; }
    .deck-slide { transition: none; filter: none; transform: none; }
    .nav-button, .nav-button::before, .nav-button::after { transition: none; animation: none !important; }
  }


  /* Chỉ bổ sung chuyển cảnh giữa các trang cùng website. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 420ms;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="pill glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5ee7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>
    <span>KHTN 6A10</span><small>tổ 3</small>
  </div>

  <main id="slideDeck" aria-label="Các trang trình chiếu">
    <!-- SLIDE 01: giữ nguyên nội dung mở đầu đã hoàn thiện. -->
    <section class="hero deck-slide is-active" id="slide-1" aria-hidden="false">
      <div>
        <h1>Xin chào tất cả các bạn và cô (thầy)</h1>
        <p class="topic">Chủ đề: Bảo vệ môi trường không khí</p>
      </div>
    </section>

    <!-- SLIDE 02: trang giới thiệu thành viên; nội dung chi tiết sẽ bổ sung sau. -->
    <section class="deck-slide members-slide" id="slide-2" aria-hidden="true">
      <div class="members-content">
        <p class="section-kicker">KHTN 6A10 · TỔ 3</p>
        <h2 class="members-title">Thành viên tổ 3</h2>
        <p class="members-subtitle">Những thành viên cùng thực hiện chủ đề<br>“Bảo vệ môi trường không khí”</p>
        <div class="members-stage">
          <p>Phần giới thiệu từng thành viên sẽ được bổ sung ở đây.</p>
        </div>
      </div>
    </section>
  </main>

  <nav class="slide-nav" aria-label="Điều hướng slide">
    <button class="nav-button" id="prevSlide" type="button" aria-label="Quay lại slide trước" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span>Trước</span>
    </button>
    <span class="slide-count" id="slideCount" aria-live="polite">01 / 02</span>
    <button class="nav-button" id="nextSlide" type="button" aria-label="Sang slide tiếp theo">
      <span>Tiếp theo</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </nav>

  <script>
  (() => {
    const slides = [...document.querySelectorAll('.deck-slide')];
    const previous = document.getElementById('prevSlide');
    const next = document.getElementById('nextSlide');
    const count = document.getElementById('slideCount');
    let active = 0;
    let locked = false;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const transitionTime = reducedMotion ? 0 : 850;

    function showSlide(index) {
      if (locked || index < 0 || index >= slides.length || index === active) return;
      locked = true;
      const oldIndex = active;
      active = index;

      slides.forEach((slide, i) => {
        slide.classList.remove('is-before', 'is-after');
        if (i === active) {
          slide.classList.add('is-active');
          slide.setAttribute('aria-hidden', 'false');
        } else {
          slide.classList.remove('is-active');
          slide.classList.add(i < active ? 'is-before' : 'is-after');
          slide.setAttribute('aria-hidden', 'true');
        }
      });

      count.textContent = `${String(active + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      previous.hidden = active === 0;
      next.hidden = active === slides.length - 1;
      window.setTimeout(() => { locked = false; }, transitionTime);
    }

    function bindNavButton(button, direction) {
      button.addEventListener('click', () => showSlide(active + direction));
    }

    bindNavButton(previous, -1);
    bindNavButton(next, 1);

    // Highlight and gentle glass tilt follow mouse/pen movement; touch gets a soft press.
    [previous, next].forEach(button => {
      const resetGlass = () => {
        button.classList.remove('is-hovered', 'is-pressed');
        button.style.setProperty('--pointer-x', '50%');
        button.style.setProperty('--pointer-y', '50%');
        button.style.setProperty('--tilt-x', '0deg');
        button.style.setProperty('--tilt-y', '0deg');
      };
      button.addEventListener('pointerenter', event => {
        if (event.pointerType !== 'touch') button.classList.add('is-hovered');
      });
      button.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch') return;
        const rect = button.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
        button.style.setProperty('--pointer-x', `${(x * 100).toFixed(1)}%`);
        button.style.setProperty('--pointer-y', `${(y * 100).toFixed(1)}%`);
        button.style.setProperty('--tilt-y', `${((x - .5) * 7).toFixed(2)}deg`);
        button.style.setProperty('--tilt-x', `${((.5 - y) * 6).toFixed(2)}deg`);
      });
      button.addEventListener('pointerleave', resetGlass);
      button.addEventListener('pointerdown', () => button.classList.add('is-pressed'));
      button.addEventListener('pointerup', () => button.classList.remove('is-pressed'));
      button.addEventListener('pointercancel', resetGlass);
      button.addEventListener('blur', resetGlass);
    });

    window.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'Enter') {
        // Enter chuyển tiếp khi đang tập trung trên slide; nút điều hướng vẫn dùng Enter bình thường.
        const target = event.target;
        if (target instanceof Element && target.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;
        event.preventDefault();
        showSlide(active + 1);
      } else if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault(); showSlide(active + 1);
      } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault(); showSlide(active - 1);
      }
    });

    // Nhấp ở bất kỳ vị trí nào trên slide để sang trang kế tiếp.
    // Bỏ qua các nút/điều khiển để nút "Trước" không bị kích hoạt hai lần.
    document.addEventListener('click', event => {
      const target = event.target;
      if (target instanceof Element && target.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;
      showSlide(active + 1);
    });

    let touchStartX = null;
    document.addEventListener('touchstart', event => {
      // Chạm/kéo nút điều hướng không được hiểu nhầm thành thao tác vuốt slide.
      if (event.target instanceof Element && event.target.closest('.nav-button')) {
        touchStartX = null;
        return;
      }
      if (event.touches.length === 1) touchStartX = event.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', event => {
      if (touchStartX === null) return;
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(deltaX) > 65) showSlide(deltaX < 0 ? active + 1 : active - 1);
      touchStartX = null;
    }, { passive: true });
  })();
  </script>
</body>
</html>
