<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Loading – KHTN 6A10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --track: #1a1a1a;
    --text: #fff;
    --dim: #9aa4c4;
    --edge: rgba(255,255,255,.14);
    --head: "Bricolage Grotesque", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    --body: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    --dur: 3.2s;            /* một chu kỳ chạy của thanh loading */
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
    font-family: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  }
  .label {
    display: flex; align-items: baseline; justify-content: center;
    color: var(--text);
    font-family: "Bricolage Grotesque", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 9vw, 56px);
    letter-spacing: -.01em;
    white-space: nowrap;
    transform-origin: 50% 50%;
    will-change: transform;
    backface-visibility: hidden;
  }
  /* cả cụm chữ (.label) sẽ: đi vào chính giữa + to lên, rồi thu nhỏ bay lên góc trái */
  .logo { display: inline-block; -webkit-font-smoothing: antialiased; view-transition-name: khtn-brand; }

  /* "- tổ 3": mặc định thụt vào trong. Thêm class .show thì lướt ra từ trái, bỏ .show thì thụt lại */
  .team {
    display: grid;
    grid-template-columns: 0fr;
    opacity: 0;
    transform: translateX(-28px);
    transition: grid-template-columns .9s cubic-bezier(.55,0,.35,1),
                opacity .7s ease,
                transform .9s cubic-bezier(.55,0,.35,1);
  }
  .team.show {
    grid-template-columns: 1fr;
    opacity: 1;
    transform: translateX(0);
    transition: grid-template-columns 1.1s cubic-bezier(.22,1,.36,1),
                opacity .9s ease-out,
                transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  .team span {
    display: block; min-width: 0; overflow: hidden; white-space: nowrap;
    padding-left: .45em;
  }
  .bar {
    position: relative;
    width: min(92vw, 760px);
    height: 4px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
    contain: layout paint;
    transition: opacity .5s ease;
  }
  /* kiểu Google (Material): đoạn trắng bo tròn hai đầu, dãn dài ra rồi co lại, có đoạn thứ hai đuổi theo */
  .fill {
    position: absolute; top: 0; bottom: 0;
    background: #fff;
    forced-color-adjust: none;
    border-radius: 4px;
    will-change: left, right;
  }
  .f1 { animation: grow1 var(--dur) cubic-bezier(.65,.815,.735,.395) infinite; }
  .f2 { animation: grow2 var(--dur) cubic-bezier(.165,.84,.44,1) 1.75s infinite; }
  @keyframes grow1 {
    0%   { left: -35%;  right: 100%; }
    60%  { left: 100%;  right: -60%; }
    100% { left: 100%;  right: -60%; }
  }
  @keyframes grow2 {
    0%   { left: -200%; right: 100%; }
    60%  { left: 107%;  right: -8%; }
    100% { left: 107%;  right: -8%; }
  }
  .hint {
    color: #bdbdbd;
    font-weight: 500;
    font-size: clamp(15px, 3.8vw, 20px);
    letter-spacing: .08em;
    transition: opacity .5s ease;
  }
  .hint i { font-style: normal; animation: dot 1.4s infinite; }
  .hint i:nth-child(2) { animation-delay: .2s; }
  .hint i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot {
    0%, 60%, 100% { opacity: .25; }
    30% { opacity: 1; }
  }
  /* gần load xong: thanh loading và chữ Loading biến mất */
  body.out .bar, body.out .hint { opacity: 0; }
  body.still .fill, body.still .hint i { animation-play-state: paused; }
  /* viên KHTN 6A10 vô hình: CÙNG CSS với ui.html và slide.html, chỉ dùng để đo vị trí + kích cỡ đích của chữ */
  .glass { border: 1px solid var(--edge); border-radius: 20px; }
  .pill {
    position: fixed; z-index: 5;
    top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px 0 10px; line-height: 18px;   /* VIÊN NÀY GIỐNG HỆT ở index.html, ui.html, slide.html: không sửa riêng từng file */
    border-radius: 999px;
    font-family: var(--head); font-weight: 800; font-size: 15px; letter-spacing: -.01em;
    animation: pillBg .7s ease-out both;
  }
  .pill svg, .pill small { animation: fadeIn .7s ease-out both; }
  .pill svg { width: 18px; height: 18px; flex: none; }
  .pill small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--dim); letter-spacing: 0; }
  .pill.ref { visibility: hidden; pointer-events: none; animation: none; }
  .pill.ref svg, .pill.ref small { animation: none; }


  /* Chỉ bổ sung chuyển cảnh giữa các trang cùng website. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 420ms;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    }
  }
</style>
</head>
<body>
  <div class="pill glass ref" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5ee7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>
    <span>KHTN 6A10</span><small>tổ 3</small>
  </div>
  <div class="label">
    <span class="logo" id="logo">KHTN 6A10</span>
    <span class="team" id="team"><span>- tổ 3</span></span>
  </div>
  <div class="bar" role="progressbar" aria-label="Đang tải"><div class="fill f1"></div><div class="fill f2"></div></div>
  <div class="hint">Loading<i>.</i><i>.</i><i>.</i></div>

<script>
  var NEXT_PAGE = 'ui.html';   // trang giao diện chính

  // Mốc thời gian (ms) tính từ lúc mở trang
  var T_OUT  = 4200;   // thanh loading + chữ Loading biến mất, KHTN 6A10 đi vào chính giữa và to lên
  var T_SHOW = 5400;   // "- tổ 3" lướt ra
  var T_HIDE = 6700;   // "- tổ 3" thụt lại vào trong (chỉ một lần, không lặp)
  var T_FLY  = 7700;   // KHTN 6A10 thu nhỏ bay lên góc trái, rồi chuyển sang ui.html
  var BIG    = 1.15;   // độ to lên khi ở chính giữa

  var body = document.body;
  var label = document.querySelector('.label');
  var team = document.getElementById('team');
  var ty = 0;          // quãng đã dịch xuống/lên để vào chính giữa màn hình

  setTimeout(toCenter, T_OUT);
  setTimeout(function () { body.classList.add('still'); }, T_OUT + 500);
  setTimeout(function () { team.classList.add('show'); }, T_SHOW);
  setTimeout(function () { team.classList.remove('show'); }, T_HIDE);
  setTimeout(fly, T_FLY);

  function toCenter() {
    body.classList.add('out');
    var r = label.getBoundingClientRect();
    ty = innerHeight / 2 - (r.top + r.height / 2);
    label.style.transition = 'transform 1.1s cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function () {
      label.style.transform = 'translate3d(0,' + ty + 'px,0) scale(' + BIG + ')';
    });
  }

  function fly() {
    // thu nhỏ về chữ 15px và bay về đúng vị trí KHTN 6A10 ở góc trái của ui.html
    var r = label.getBoundingClientRect();           // đang ở giữa màn hình, đã to lên
    var w = r.width / BIG;
    var cx = r.left + r.width / 2;                   // tâm ngang (không đổi)
    var cy = r.top + r.height / 2 - ty;              // tâm dọc lúc chưa dịch
    var t = document.querySelector('.pill > span').getBoundingClientRect();   // chữ KHTN 6A10 thật ở góc (cùng CSS với ui.html)
    var s = t.width / w;
    var dx = (t.left + t.width / 2) - cx;
    var dy = (t.top + t.height / 2) - cy;

    label.style.transition = 'transform 1.5s cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function () {
      label.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0) scale(' + s + ')';
    });

    var gone = false;
    function next() { if (!gone) { gone = true; location.replace(NEXT_PAGE); } }
    label.addEventListener('transitionend', function (e) { if (e.target === label) setTimeout(next, 120); });
    setTimeout(next, 2200);   // dự phòng nếu transitionend không chạy
  }
</script>
</body>
</html>
