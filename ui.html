<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Slide KHTN trên web – KHTN 6A10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060914;
    --text: #f2f5ff;
    --dim: #9aa4c4;
    --cyan: #5ee7ff;
    --violet: #8b7bff;
    --flame: #ff8a4c;
    --glass: rgba(255,255,255,.06);
    --edge: rgba(255,255,255,.14);
    --head: "Bricolage Grotesque", "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    --body: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; color: var(--text); font-family: var(--body); background: #000; min-height: 100%; }

  /* nền tĩnh (không animation) nên rất nhẹ */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    animation: fadeIn 1.6s ease-out both;
    background:
      radial-gradient(600px 420px at 12% 8%, rgba(94,231,255,.22), transparent 70%),
      radial-gradient(640px 460px at 88% 30%, rgba(139,123,255,.26), transparent 70%),
      radial-gradient(520px 380px at 40% 100%, rgba(255,138,76,.18), transparent 70%),
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px) 0 0 / 26px 26px,
      var(--bg);
  }
  .glass {
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 20px;
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.28);
  }

  /* KHTN 6A10 thu nhỏ ở góc trái (khớp với chữ bay lên từ trang loading) */
  .pill {
    position: fixed; z-index: 5;
    top: 14px; left: 14px;
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 14px 0 10px; line-height: 18px;   /* VIÊN NÀY GIỐNG HỆT ở index.html, ui.html, slide.html: không sửa riêng từng file */
    border-radius: 999px;
    font-family: var(--head); font-weight: 800; font-size: 15px; letter-spacing: -.01em;
    animation: pillBg .7s ease-out both;
  }
  .pill svg, .pill small { animation: fadeIn .7s ease-out both; }
  .pill > span { view-transition-name: khtn-brand; }
  .pill svg { width: 18px; height: 18px; flex: none; }
  .pill small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--dim); letter-spacing: 0; }
  @keyframes pillBg { from { background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; } }
  @keyframes fadeIn { from { opacity: 0; } }

  main { max-width: 1040px; margin: 0 auto; padding: 20px; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; animation: fadeIn 1.4s ease-out .35s both; }

  .hero { display: flex; align-items: center; justify-content: center; text-align: center; }
  .hero h1 {
    margin: 0; font-family: var(--head); font-weight: 800;
    font-size: clamp(40px, 9vw, 92px); line-height: 1; letter-spacing: -.03em;
    text-shadow: 0 0 40px rgba(94,231,255,.35);
  }
  .hero p { margin: 18px auto 0; max-width: 46ch; color: var(--dim); font-size: clamp(15px, 2.4vw, 18px); line-height: 1.6; }




  @media (prefers-reduced-motion: reduce) { .pill, .pill svg, .pill small, main, .bg { animation: none; } }

  /* 3 lựa chọn */
  .opts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 30px; }
  .opt {
    min-width: 168px; padding: 14px 22px; border-radius: 16px; text-align: center;
    color: var(--text); font-family: var(--body); font-size: 16px;
    display: flex; flex-direction: column; gap: 4px; justify-content: center;
  }
  .opt b { font-family: var(--head); font-weight: 700; font-size: 17px; }
  .opt small { font-size: 12px; color: var(--dim); }
  .opt.live { cursor: pointer; border-color: rgba(94,231,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 22px -6px var(--cyan); transition: transform .18s ease; appearance: none; }
  .opt.live:hover { transform: translateY(-3px); }
  .opt.live:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* màn hình loading phủ lên nền ui (không có nền đen riêng) */
  .ld {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    opacity: 0; transition: opacity .5s ease;
  }
  .ld.on { display: flex; }
  .ld.vis { opacity: 1; }
  .label {
    display: flex; align-items: baseline; justify-content: center;
    color: var(--text); font-family: var(--head); font-weight: 800;
    font-size: clamp(30px, 9vw, 56px); letter-spacing: -.01em; white-space: nowrap;
    transform-origin: 50% 50%; will-change: transform; backface-visibility: hidden;
  }
  .team {
    display: grid; grid-template-columns: 0fr; opacity: 0; transform: translateX(-28px);
    transition: grid-template-columns .9s cubic-bezier(.55,0,.35,1), opacity .7s ease, transform .9s cubic-bezier(.55,0,.35,1);
  }
  .team.show {
    grid-template-columns: 1fr; opacity: 1; transform: translateX(0);
    transition: grid-template-columns 1.1s cubic-bezier(.22,1,.36,1), opacity .9s ease-out, transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  .team span { display: block; min-width: 0; overflow: hidden; white-space: nowrap; padding-left: .45em; }
  .bar {
    position: relative; width: min(92vw, 760px); height: 4px; border-radius: 4px;
    background: rgba(255,255,255,.14); overflow: hidden; contain: layout paint; transition: opacity .5s ease;
  }
  .fill { position: absolute; top: 0; bottom: 0; background: #fff; border-radius: 4px; will-change: left, right; }
  .f1 { animation: grow1 3.2s cubic-bezier(.65,.815,.735,.395) infinite; }
  .f2 { animation: grow2 3.2s cubic-bezier(.165,.84,.44,1) 1.75s infinite; }
  @keyframes grow1 { 0% { left: -35%; right: 100%; } 60%, 100% { left: 100%; right: -60%; } }
  @keyframes grow2 { 0% { left: -200%; right: 100%; } 60%, 100% { left: 107%; right: -8%; } }
  .hint { color: #bdbdbd; font-weight: 500; font-size: clamp(15px, 3.8vw, 20px); letter-spacing: .08em; transition: opacity .5s ease; }
  .hint i { font-style: normal; animation: dot 1.4s infinite; }
  .hint i:nth-child(2) { animation-delay: .2s; }
  .hint i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .ld.out .bar, .ld.out .hint { opacity: 0; }
  .ld.still .fill, .ld.still .hint i { animation-play-state: paused; }


  /* Chỉ bổ sung chuyển cảnh giữa các trang cùng website. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 420ms;
      animation-timing-function: cubic-bezier(.22, 1, .36, 1);
    }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="pill glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5ee7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>
    <span>KHTN 6A10</span><small>tổ 3</small>
  </div>

  <main>
    <!-- ===== PHẦN ĐẦU TRANG: sửa tiêu đề và mô tả ở đây ===== -->
    <section class="hero">
      <div>
        <h1>Slide KHTN trên web</h1>
        <p>Slide về môn Hóa, chủ đề bảo vệ môi trường không khí.</p>
        <!-- ===== 3 LỰA CHỌN: PowerPoint (đang làm), Canva (để trống), Slide trên web (bấm để vào) ===== -->
        <div class="opts">
          <div class="opt glass"><b>PowerPoint</b><small>Đang trong quá trình</small></div>
          <div class="opt glass"><b>Canva</b></div>
          <button class="opt glass live" id="goSlide" type="button"><b>Slide tại đây</b></button>
        </div>
      </div>
    </section>
  </main>

  <div class="ld" id="ld" aria-hidden="true">
    <div class="label" id="ldLabel"><span>KHTN 6A10</span><span class="team" id="ldTeam"><span>- tổ 3</span></span></div>
    <div class="bar"><div class="fill f1"></div><div class="fill f2"></div></div>
    <div class="hint">Loading slides<i>.</i><i>.</i><i>.</i></div>
  </div>

<script>
  var SLIDE_PAGE = 'slide.html';   // trang slide trên web của bạn

  var ld = document.getElementById('ld'), label = document.getElementById('ldLabel'), team = document.getElementById('ldTeam');
  var BIG = 1.15, ty = 0, started = false;

  document.getElementById('goSlide').addEventListener('click', start);
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

  function start() {
    if (started) return; started = true;

    // Chuyển tên hiệu ứng từ logo cố định sang logo đang bay; không đổi animation gốc.
    var brandText = document.querySelector('.pill > span');
    brandText.style.viewTransitionName = 'none';
    label.children[0].style.viewTransitionName = 'khtn-brand';

    // giao diện ui mờ đi, nền ui giữ nguyên
    document.querySelector('main').animate({ opacity: [1, 0] }, { duration: 500, fill: 'forwards' });
    document.querySelector('.pill').animate({ opacity: [1, 0] }, { duration: 500, fill: 'forwards' });

    // màn loading hiện ra ngay, chữ KHTN 6A10 đứng đúng chỗ ở góc trái (thanh + chữ Loading chưa hiện)
    ld.style.transition = 'none';
    ld.classList.add('on', 'vis', 'out');
    var r = label.getBoundingClientRect();
    var t = document.querySelector('.pill > span').getBoundingClientRect();   // chữ KHTN 6A10 thật ở góc
    var s = t.width / r.width;
    var dx = (t.left + t.width / 2) - (r.left + r.width / 2);
    var dy = (t.top + t.height / 2) - (r.top + r.height / 2);
    label.style.transition = 'none';
    label.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0) scale(' + s + ')';
    label.getBoundingClientRect();

    // chữ KHTN 6A10 từ góc đi xuống vị trí trên thanh loading
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        label.style.transition = 'transform 1.3s cubic-bezier(.65,0,.35,1)';
        label.style.transform = 'translate3d(0,0,0) scale(1)';
      });
    });

    // mốc thời gian (ms) tính từ lúc bấm
    setTimeout(function () { ld.classList.remove('out'); }, 1500);      // thanh loading + chữ "Loading slides" hiện ra
    setTimeout(toCenter, 4300);                                         // thanh + chữ Loading biến mất, chữ vào giữa và to lên
    setTimeout(function () { ld.classList.add('still'); }, 4800);
    setTimeout(function () { team.classList.add('show'); }, 5500);      // "- tổ 3" lướt ra
    setTimeout(function () { team.classList.remove('show'); }, 6800);   // thụt lại vào trong (một lần)
    setTimeout(fly, 7800);                                              // thu nhỏ bay lên góc trái rồi sang slide
  }

  function toCenter() {
    ld.classList.add('out');
    var r = label.getBoundingClientRect();
    ty = innerHeight / 2 - (r.top + r.height / 2);
    label.style.transition = 'transform 1.1s cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function () { label.style.transform = 'translate3d(0,' + ty + 'px,0) scale(' + BIG + ')'; });
  }

  function fly() {
    var r = label.getBoundingClientRect();
    var w = r.width / BIG, cx = r.left + r.width / 2, cy = r.top + r.height / 2 - ty;
    var t = document.querySelector('.pill > span').getBoundingClientRect();   // chữ KHTN 6A10 thật ở góc
    var s = t.width / w;
    var dx = (t.left + t.width / 2) - cx, dy = (t.top + t.height / 2) - cy;
    label.style.transition = 'transform 1.5s cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function () { label.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0) scale(' + s + ')'; });
    var gone = false;
    function next() { if (!gone) { gone = true; location.href = SLIDE_PAGE; } }
    label.addEventListener('transitionend', function (e) { if (e.target === label) setTimeout(next, 120); });
    setTimeout(next, 2200);
  }
</script>
</body>
</html>
